services:
  - type: web
    name: agroconnect
    runtime: python
    buildCommand: "pip install -r agroconnect/requirements.txt && cd agroconnect && python manage.py collectstatic --no-input && python manage.py migrate --no-input && python manage.py create_superuser_if_missing"
    startCommand: "cd agroconnect && gunicorn agroconnect.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    plan: free

    disk:
      name: agroconnect-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: DATABASE_PATH
        value: "/data/db.sqlite3"

      - key: DJANGO_SETTINGS_MODULE
        value: "agroconnect.settings"

      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@agroconnect.ng"

      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin@agroconnect.ng"

      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      - key: PAYSTACK_SECRET_KEY
        sync: false

      - key: PAYSTACK_CALLBACK_URL
        sync: false

      - key: SMS_BACKEND
        value: "console"

      - key: EMAIL_HOST
        sync: false

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        value: "noreply@agroconnect.ng"

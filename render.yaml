services:
  - type: web
    name: agroconnect
    runtime: python
    rootDir: agroconnect
    buildCommand: "./build.sh"
    startCommand: "gunicorn agroconnect.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    plan: free

    envVars:
      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true          # Render generates a secure random value

      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: DATABASE_URL
        fromDatabase:
          name: agroconnect-db
          property: connectionString

      - key: PAYSTACK_SECRET_KEY
        sync: false                   # You paste this manually in Render dashboard

      - key: PAYSTACK_CALLBACK_URL
        sync: false                   # Set after deploy: https://your-app.onrender.com/payments/callback/

      - key: SMS_BACKEND
        value: "console"              # Change to "africastalking" when ready

      - key: EMAIL_HOST
        sync: false

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        value: "noreply@agroconnect.ng"

databases:
  - name: agroconnect-db
    databaseName: agroconnect
    plan: free

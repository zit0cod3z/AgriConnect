{% extends "base.html" %}
{% block title %}Login — AgroConnect{% endblock %}
{% block content %}
<div class="container" style="max-width:440px;padding-top:50px;padding-bottom:60px;">
  <div class="panel panel-default">
    <div class="panel-heading" style="background:#2E7D32;color:#fff;">
      <h3 class="panel-title" style="font-size:18px;">&#128274; Login to AgroConnect</h3>
    </div>
    <div class="panel-body">

      {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{ msg.tags|default:'danger' }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}

      <form method="post" class="form-agro">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_email">Email Address</label>
          <!-- name="email" must match LoginForm field name -->
          <input type="email" name="email" id="id_email" class="form-control"
                 placeholder="your@email.com" required autofocus>
        </div>
        <div class="form-group">
          <label for="id_password">Password</label>
          <input type="password" name="password" id="id_password" class="form-control"
                 placeholder="Your password" required>
        </div>
        <button type="submit" class="btn btn-agro-primary btn-block btn-lg">Login</button>
      </form>
      <hr>
      <p class="text-center" style="margin-bottom:6px;">
        <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
      </p>
      <p class="text-center" style="margin:0;">
        New here? <a href="{% url 'accounts:register' %}">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Password Reset — AgroConnect{% endblock %}
{% block content %}
<div class="container" style="max-width:440px;padding-top:50px;padding-bottom:60px;">
  <div class="panel panel-default">
    <div class="panel-heading" style="background:#2E7D32;color:#fff;">
      <h3 class="panel-title">&#128274; Reset Password</h3>
    </div>
    <div class="panel-body">
      <p class="text-muted" style="font-size:13px;">Enter your email address and we'll send you a reset link.</p>
      <form method="post" class="form-agro">
        {% csrf_token %}
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
        </div>
        <button type="submit" class="btn btn-agro-primary btn-block">Send Reset Link</button>
      </form>
      <hr>
      <p class="text-center" style="margin:0;"><a href="{% url 'accounts:login' %}">Back to Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
